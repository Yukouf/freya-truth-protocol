<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Freya Truth Protocol — architecture réelle</title><desc id="desc">Trois appels successifs au même modèle configuré. Aucun accès aux sources ; échec fermé si un rôle ne répond pas.</desc>
